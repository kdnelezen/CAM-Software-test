app-id: io.github.kdnelezen.CAMSoftware
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: cam-software
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
modules:
  - name: cam-software-test
    buildsystem: simple
    build-commands:
      - install -d /app/lib/cam-software /app/bin /app/share/applications /app/share/icons/hicolor/scalable/apps
      - cp -r dist/CAMSoftware/* /app/lib/cam-software/
      - install -m 0755 packaging/flatpak/cam-software-wrapper.sh /app/bin/cam-software
      - install -m 0644 packaging/linux/cam-software.desktop /app/share/applications/io.github.kdnelezen.CAMSoftware.desktop
      - install -m 0644 packaging/linux/icons/cam-software.svg /app/share/icons/hicolor/scalable/apps/io.github.kdnelezen.CAMSoftware.svg
    sources:
      - type: dir
        path: ../../
